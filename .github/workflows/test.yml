name: Verify route auditor

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python mihomo_route_audit.py --version
      - run: python mihomo_route_audit.py --policy examples/policy.example.json --snapshot examples/snapshot.example.json
